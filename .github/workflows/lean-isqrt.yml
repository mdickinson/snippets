name: Lean 4 isqrt proof

on:
  push:
    branches: ["main"]
    paths:
      - "proofs/isqrt/**"
      - ".github/workflows/lean-isqrt.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "proofs/isqrt/**"
      - ".github/workflows/lean-isqrt.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: leanprover/lean-action@v1
        with:
          build-args: "--wfail"
          lint: "true"
          lake-package-directory: proofs/isqrt
